<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Голосовой комментарий в Битрикс24</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 24px;
      color: #1a1a1a;
    }
    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2e7d32;
    }
    .buttons {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #recordBtn {
      background: #e53935;
      color: #fff;
    }
    #recordBtn.recording {
      background: #b71c1c;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    #sendBtn {
      background: #2e7d32;
      color: #fff;
    }
    #sendBtn:hover:not(:disabled) { background: #1b5e20; }
    #recordBtn:hover:not(:disabled) { background: #c62828; }
    #recordBtn.recording:hover { background: #b71c1c; }
    .status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.info { background: #e3f2fd; color: #0d47a1; display: block; }
    .status.success { background: #e8f5e9; color: #1b5e20; display: block; }
    .status.error { background: #ffebee; color: #b71c1c; display: block; }
    audio {
      width: 100%;
      margin-top: 16px;
      display: none;
    }
    audio.visible { display: block; }
    .timer {
      font-family: monospace;
      font-size: 18px;
      color: #b71c1c;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .timer.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎤 Голосовой комментарий в сделку</h1>

    <label for="dealId">ID сделки</label>
    <input type="text" id="dealId" placeholder="Например: 12345" inputmode="numeric" />

    <div class="buttons">
      <button id="recordBtn">▶ Записать</button>
      <button id="sendBtn" disabled>📤 Отправить</button>
    </div>

    <div class="timer" id="timer">00:00</div>
    <audio id="preview" controls></audio>

    <div class="status" id="status"></div>
  </div>

  <script>
    // ============================================================
    // ⚙️ НАСТРОЙКА — ВСТАВЬТЕ СЮДА URL НОВОГО ВЕБХУКА
    // ============================================================
    const WEBHOOK_URL = 'https://ВАШ_ПОРТАЛ.bitrix24.ru/rest/1/НОВЫЙ_КОД/';
    // ============================================================

    const dealIdInput = document.getElementById('dealId');
    const recordBtn = document.getElementById('recordBtn');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const previewEl = document.getElementById('preview');
    const timerEl = document.getElementById('timer');

    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBlob = null;
    let stream = null;
    let timerInterval = null;
    let secondsElapsed = 0;

    function setStatus(text, type = 'info') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    function clearStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function formatTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function startTimer() {
      secondsElapsed = 0;
      timerEl.textContent = '00:00';
      timerEl.classList.add('visible');
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerEl.textContent = formatTime(secondsElapsed);
        // Автостоп на 5 минутах
        if (secondsElapsed >= 300) {
          stopRecording();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    async function startRecording() {
      clearStatus();
      recordedBlob = null;
      previewEl.classList.remove('visible');
      previewEl.src = '';
      sendBtn.disabled = true;

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus('❌ Нет доступа к микрофону: ' + e.message, 'error');
        return;
      }

      // Выбираем поддерживаемый формат
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');

      try {
        mediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);
      } catch (e) {
        setStatus('❌ Ошибка инициализации записи: ' + e.message, 'error');
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        stopTimer();
        recordedBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        previewEl.src = URL.createObjectURL(recordedBlob);
        previewEl.classList.add('visible');
        sendBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '▶ Записать заново';
        setStatus(`✅ Записано ${formatTime(secondsElapsed)}. Проверьте и отправьте.`, 'success');
        stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.onerror = (e) => {
        setStatus('❌ Ошибка записи: ' + (e.error?.message || 'неизвестно'), 'error');
        stopTimer();
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '▶ Записать';
        if (stream) stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.start();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹ Остановить';
      startTimer();
      setStatus('🔴 Идёт запись...', 'info');
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    recordBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        const dealId = dealIdInput.value.trim();
        if (!dealId) {
          setStatus('⚠️ Сначала введите ID сделки', 'error');
          dealIdInput.focus();
          return;
        }
        startRecording();
      }
    });

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function sendToBitrix(dealId, blob) {
      const base64 = await blobToBase64(blob);
      const fileName = `voice_${Date.now()}.webm`;
      const now = new Date().toLocaleString('ru-RU');

      const payload = {
        fields: {
          ENTITY_TYPE: 'deal',
          ENTITY_ID: parseInt(dealId, 10),
          COMMENT: `🎤 Голосовое сообщение (${formatTime(secondsElapsed)}) — ${now}`,
          FILES: [[fileName, base64]]
        }
      };

      const res = await fetch(`${WEBHOOK_URL}crm.timeline.comment.add.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.error) {
        throw new Error(`${data.error}: ${data.error_description || ''}`);
      }
      return data.result;
    }

    sendBtn.addEventListener('click', async () => {
      const dealId = dealIdInput.value.trim();
      if (!dealId) {
        setStatus('⚠️ Введите ID сделки', 'error');
        return;
      }
      if (!recordedBlob) {
        setStatus('⚠️ Сначала запишите сообщение', 'error');
        return;
      }

      sendBtn.disabled = true;
      recordBtn.disabled = true;
      setStatus('⏳ Отправка в Битрикс24...', 'info');

      try {
        const commentId = await sendToBitrix(dealId, recordedBlob);
        setStatus(`✅ Отправлено! ID комментария: ${commentId}`, 'success');
        // Сброс
        recordedBlob = null;
        previewEl.classList.remove('visible');
        previewEl.src = '';
        recordBtn.textContent = '▶ Записать';
        timerEl.classList.remove('visible');
      } catch (e) {
        setStatus('❌ Ошибка отправки: ' + e.message, 'error');
        sendBtn.disabled = false;
      } finally {
        recordBtn.disabled = false;
      }
    });

    // Разрешаем только цифры в поле ID
    dealIdInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });
  </script>
</body>
</html>
